<!DOCTYPE html>
<html lang=""es">

<head>
    <meta charset="!UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo-Studiopolis</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alphinejs@2.x.x/dist/cdn.min.js"></script>
    </head>

    <body>
        <div id="Almacenamiento.principal" x.data="{
            busqueda: "",
            reproduciendo: false,
            cancionActual: "Let's Groove - Earth, Wind & Fire",
            canciones: [
            { id: 1, titulo: "Let's Groove", artista: "Earth, Wind & Fire", genero: "Funk/Disco", anio: 1981, archivo: "cancion/1.mp3", favorito:false},
            { id: 2, titulo: "Lights, Camera, Action", artist: "Tee Lopes", genero: "Jazz/Big Band", anio: 2017, archivo: "cancion/2.mp3", favorito:true}
            { id: 3, titulo: "Teknopathetic", artist: "Hideki Naganuma", genero"Electro/Funk", anio: 2017, archivo:"cancion/3.mp3", favorito:true}
            ],
            seleccionarCancion(cancion){
                this.cancionActual= cancion.titulo + "-" + cancion.artista;
                this.$refs.audio.src = cancion.archivo;
                this.$refs.audio.play();
                this.reproduciendo = true;
            }
        }">

        <header>
            <h1>Catálogo-Studiopolis</h1>

                <form id="Buscador" @submit.prevent>
                    <label for="busqueda">Busca canción o artista:</label>
                    <input type="text" id="busqueda" name="cancion" x-model="busqueda" placeholder="Ej. OyarzunDeidad, Phonk">
                    <button type="submit">Buscar</button>             
                </form>
            </header>

        <aside>
            <h2>Studiopolis</h2>
            <nav aria-label="Menu Principal">
                <ul class="manu-navegacion">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="catalogo.html" class="activo"></a></li>
                    <li><a href="playlists.html">Playlists</a></li>
                    <li><a href="favoritos.html">Favoritos</a></li>
                    <li><a href="historial.html">Historial</a></li>
                    <li><a href="estadisticas.html">Estadisticas</a></li>
                    <li><a href="login.html">Cerrar Sesion</a></li>
                </ul>
            </nav>
        </aside>

        <main id="lista">
            <h2>Explorar Canciones y Artistas</h2>

            <div class="conjunto-catalogo">
                <template x-for="cancion in canciones.filter(pista => pista.titulo.toLowerCase().includes(busqueda.toLowerCase()) || pista.artista.toLowerCase().includes(busqueda.toLowerCase()) || pista.genero.toLowerCase().includes(busqueda.toLowerCase()))" :key="cancion.numero">
                    <article class="ficha-cancion">
                        <h3 x-text="cancion.titulo"></h3>
                        <p><strong>Artista:</strong> <span x-text="cancion.artista"></span></p>
                        <p><strong>Genero:</strong> <span x-text="cancion.genero"></span></p>
                        <p><strong>Año:</strong> <span x-text="cancion.anio"></span></p>

                        <div class="acciones-ficha">
                            <button type="button" class="boton-escuchar" @click="seleccionarCancion(cancion)">
                                Escuchar
                            </button>
                            <button type="button" class="boton-escuchar" @click="cancion.favorito" = !cancion.favorito" aria-label="Marcar como favorito">
                              <span x-text="cancion.favorito ? 'En favoritos' : 'Agregar a favoritos'"></span>  
                            </button>
                        </div>                         
                    </article>
                </template>
            </div>
        </main>

        <footer id="reproductor">
            <audio id="audio-reproductor" x-ref="audio" src="cancion/1.mp3"></audio>
            <div class="controles">
                <p class="cancion.activa" x-text=" 'Sonando: ' + cancionActual"></p>

                <div class="botonera-musica">
                    <button class="boton-accion" aria-label="Aleatorio">Aleatorio</button>
                    <button class="boton-accion" aria-label="Anterior">Anterior</button>

                    <button class="boton-accion boton-reproducir-pausar"
                    aria-label="Reproducir o Pausar"
                    @click="reproduciendo = !reproduciendo; reproducion ? $refs.audioplay() : $refs.audio.pause() ">
                <span x-text="reproduciendo ? 'Pausar' : 'Reproducir'"></span>
                </button>

                <button class="boton-accion" aria-label="Siguiente">Siguiente</button>
                <button class="boton-accion" aria-label="Repetir">Repetir</button>
                </div>

            <div class="progreso">
                <span class="marca-tiempo tiempo-actual">0:01</span>
                <input type="range" class="barra-deslizante" min="0" max="100" value="1" aria-label="Progreso de la canción">
                <span class="marca-tiempo tiempo-total">3:08</span>
            </div>
          </div>
        </footer>
    </div>
</body>
</html>
