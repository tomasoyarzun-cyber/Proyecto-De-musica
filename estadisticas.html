<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Studiopolis - Estadísticas</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#9d72ff">
</head>

<body class="bg-[#181818] text-white">
    
    <section id="inicio" x-data="{
        favoritos: JSON.parse(localStorage.getItem('favoritos_studiopolis')) || [],
        historial: JSON.parse(localStorage.getItem('historial_studiopolis')) || [],
        totalClicks: parseInt(localStorage.getItem('clicks_studiopolis')) || 0,
        segundosEscuchados: parseInt(localStorage.getItem('tiempo_reproducido_studiopolis')) || 0,

        get totalFavoritos() {
            return this.favoritos.length;
        },

        get tiempoFormateado() {
            const horas = Math.floor(this.segundosEscuchados / 3600);
            const minutos = Math.floor((this.segundosEscuchados % 3600) / 60);
            if (horas > 0) {
                return `${horas}h ${minutos}m`;
            }
            return `${minutos} min`;
        },

        get cancionMasEscuchada() {
            if (this.historial.length === 0) return 'Ninguna';
            const conteo = {};
            this.historial.forEach(c => {
                const titulo = c.titulo || c;
                conteo[titulo] = (conteo[titulo] || 0) + 1;
            });
            return Object.keys(conteo).reduce((a, b) => conteo[a] > conteo[b] ? a : b, 'Ninguna');
        },

        get generoTop() {
            if (this.favoritos.length === 0) return 'Sin datos';
            const conteo = {};
            this.favoritos.forEach(c => {
                if (c.genero) conteo[c.genero] = (conteo[c.genero] || 0) + 1;
            });
            return Object.keys(conteo).reduce((a, b) => conteo[a] > conteo[b] ? a : b, 'Sin datos');
        }
    }">
        <header class="p-4">
            <h1>Tus Estadísticas</h1>
        </header>

        <section id="lista" class="p-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-[#242424] p-6 rounded-lg border border-gray-700">
                <h3 class="text-gray-400 text-sm">Tiempo Reproducido</h3>
                <p class="text-3xl font-bold text-[#9d72ff] mt-2" x-text="tiempoFormateado"></p>
            </div>

            <div class="bg-[#242424] p-6 rounded-lg border border-gray-700">
                <h3 class="text-gray-400 text-sm">Total de Clics</h3>
                <p class="text-3xl font-bold text-white mt-2" x-text="totalClicks"></p>
            </div>

            <div class="bg-[#242424] p-6 rounded-lg border border-gray-700">
                <h3 class="text-gray-400 text-sm">Canción Más Escuchada</h3>
                <p class="text-xl font-bold text-white mt-2 truncate" x-text="cancionMasEscuchada"></p>
            </div>

            <div class="bg-[#242424] p-6 rounded-lg border border-gray-700">
                <h3 class="text-gray-400 text-sm">Favoritas / Género Top</h3>
                <p class="text-xl font-bold text-[#9d72ff] mt-2">
                    <span x-text="totalFavoritos"></span> canciones (<span x-text="generoTop"></span>)
                </p>
            </div>
        </section>

        <aside>
            <nav>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="catalogo.html">Catalogo</a></li>
                    <li><a href="playlists.html">Mis Playlists</a></li>
                    <li><a href="favoritos.html">Favoritos</a></li>
                    <li><a href="historial.html">Historial</a></li>
                    <li><a href="estadisticas.html">Estadisticas</a></li>
                </ul>
            </nav>
        </aside>
    </section>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(reg => console.log('Service Worker registrado correctamente:', reg.scope))
                    .catch(err => console.error('Error al registrar Service Worker:', err));
            });
        }
    </script>
</body>

</html>
