<!DOCTYPE html>
<html lang="es">
<head>
     <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadisticas-Studiopolis</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#9d72ff">
</head>
<body>
    <div id="inicio" x-data='{
        minutosEscuchados: 12450,
        artistaTop: "Earth, Wind & Fire",
        generoTop: "Funk/Disco",
        cancionesMasEscuchadas: [
        {titulo: "Lets Groove", reproducciones:342},
        {titulo: "Teknopathetic", reproducciones:289},
        {titulo: "Lights, Camera, Action", reproducciones:156}]
    }'>
    <header>
        <h1>Tus Estadisticas</h1>
    </header>

    <aside>
        <h2>Studiopolis</h2>
        <nav aria-label="Menu Principal">
            <ul class="menu-navegacion">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="catalogo.html">Catálogo</a></li>
            <li><a href="playlists.html">Mis Playlists</a></li>
            <li><a href="favoritos.html">Favoritos</a></li>
            <li><a href="historial.html">Historial</a></li>
            <li><a href="estadisticas.html" class="activo">Estadísticas</a></li>
            <li><a href="login.html">Cerrar Sesión</a></li>
            </ul>
        </nav>
    </aside>

    <main id="lista">
        <h2>Tu Resumen Musical</h2>
        <div class="conjunto-catalogo">
            <article class="ficha-cancion">
                <h3>Tiempo Total</h3>
                <p class="text-4xl font-bold text-marca"><span x-text="minutosEscuchados"></span> min</p>       
            </article>

            <article class="ficha-cancion">
                <h3>Artista Favorito</h3>
                <p class="text-2xl font-bold" x-text="artistaTop"></p>
            </article>

            <article class="ficha-cancion">
                <h3>Género principal</h3>
                <p class="text-2xl font-bold" x-text="generoTop"></p>
            </article>
        </div>

        <h2 class="mt-8 mb-4">Top Canciones</h2>
        <div class="conjunto-catalogo">
            <template x-for="(cancion, index) in cancionesMasEscuchadas" :key="index">
              <article class="ficha-cancion">
                <h3 x-text=" '#' + (index+1) + ' ' + cancion.titulo"></h3>
                <p>Reproducciones: <strong class="text-marca" x-text="cancion.reproducciones"></strong></p>
              </article>   
            </template>
        </div>
    </main>
</div>
<script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(reg => console.log('Service Worker registrado correctamente:', reg.scope))
                    .catch(err => console.error('Error al registrar Service Worker:', err));
            });
        }
    </script>
</body>
</html>
