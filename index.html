<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Musica</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        #inicio {
            display: none;   
        }
    </style>
    
    </head>

<body>

    
    <section id="login">
        <h1>Studiopolis</h1>
        <p>Ama la musica</p>
        <p>Primero tienes que autenticarte</p>

        <form id="formulario">
            <label for="nombre">Nombre de usuario</label>
            <input id="nombre" type="text" name="nombre" required>
            <button type="submit">Iniciar Sesión</button>
        </form>
    </section>

    
    <section id="inicio" x-data="cancionController(new CancionServicio(new LocalStorageCancionRepository()))">
        <header>
            <h1>Musica a todo volumen</h1>
            <form id="buscador" @submit.prevent="buscar()">
                <label for="cancion">Buscar canción:</label>
                <input type="text" id="cancion" name="cancion" x-model="criterio" @input="buscar()" placeholder="Título, artista, id o año...">
                <button type="submit">Buscar</button>
               </form>
             </header>

    <section id="lista" x-show="cancionesFiltradas.length > 0">
            <h2>Información de la canción:</h2>
            <template x-for="item in cancionesFiltradas" :key="item.id">
             <article @click="reproducir(item)" style="cursor: pointer; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px;">
            <p>Nombre De la Canción: <strong x-text="item.titulo"></strong></p>
            <p>Artista: <span x-text="item.artista"></span></p>
            <p>Genero: <span x-text="item.genero"></span></p>
            <p>Año de Lanzamiento: <span x-text="item.anio"></span></p>
           </article>
            </template>
        </section>

        
        <aside>
            <section id="favorito">
                <h2>Canciones Favoritas: </h2>
            </section>
            <section id="playlist">
                <h2>Playlist:</h2>
            </section>
            </aside>
            
            <footer id="reproductor" x-data="{ reproduciendo: false }">
            <audio id="play" x-ref="audio" :src="cancionActual ? cancionActual.src : ''"></audio>
            <!--Usare emojis para los simbolos de prueba de el reproductor
            Despues buscamos en alguna pagina algunos iconos gratis o algo asi-->
            
            <div class="controles-principales">
                <div class="botones-musica">
                    <button class="boton-uso" aria-label="Aleatorio">🔀</button>
                    <button class="boton-uso" aria-label="Anterior">⏮</button>
                    <button class="boton-uso boton-reproducir-pausar"
                    aria-label="Reproducir/Pausar" 
                    @click="reproduciendo= !reproduciendo; reproduciendo ? $refs.audio.play(): $refs.audio.pause()">
                    <span x-text="reproduciendo ? '⏸' : '▶'"></span>
                    </button>
                    <button class="boton-uso" aria-label="Siguiente">⏭</button>
                    <button class="boton-uso" aria-label="Repetir">🔁</button>
                    </div>

                    <div class="progreso">
                        <span class="marca-tiempo tiempo-actual">0:01</span>
                        <input type="rango" class="barra" min="0" max="100" value="1" aria-label=""Progreso de la canción">
                        <span class="marca-tiempo tiempo-total">3:08</span>
                    </div>
                </div>
            </footer>
       


    <script src="js/repositorios/cancionrepository.js"></script>
    <script src="js/repositorios/localstoragecancionrepository.js"></script>
    <script src="js/servicios/cancionservicio.js"></script>
    <script src="js/controladores/cancioncontroller.js"></script>
    <script src="script.js"></script>
</body>

</html>
